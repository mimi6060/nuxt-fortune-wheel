services:
  # Nuxt Application - Uses Aiven cloud database
  app:
    build:
      context: ..
      dockerfile: playground/Dockerfile
    container_name: fortune-wheel-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    env_file:
      - .env
    environment:
      NUXT_HOST: 0.0.0.0
      NUXT_PORT: 3001

  # Prisma Studio
  studio:
    image: node:20-alpine
    container_name: fortune-wheel-studio
    working_dir: /app/playground
    command: sh -c "npx prisma@6.8.0 studio --port 5555 --browser none --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:5555:5555"
    env_file:
      - .env
    volumes:
      - ./prisma:/app/playground/prisma:ro
